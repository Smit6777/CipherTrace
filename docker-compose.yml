version: '3.8'

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novalite
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"

  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      NOVALITE_DB_HOST: db
      NOVALITE_DB_USER: root
      NOVALITE_DB_PASS: root
      NOVALITE_DB_NAME: novalite
    depends_on:
      - db
